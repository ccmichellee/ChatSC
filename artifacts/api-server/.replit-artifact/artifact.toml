kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && python web/api/run.py"

[services.production]
build = ["sh", "-c", "cd ../.. && uv sync --no-dev"]

[services.production.run]
args = ["sh", "-c", "cd ../.. && python web/api/run.py"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
