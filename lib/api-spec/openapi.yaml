openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /signups:
    post:
      operationId: createSignup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupInput" }
      responses:
        "201":
          description: Signup stored privately; no personal data returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupReceipt" }
    get:
      operationId: getSignups
      security: [{ SignupKey: [] }]
      parameters:
        - { name: after_id, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Private bot feed, never requested by the website
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupFeed" }
        "401": { description: Invalid API key }
        "503": { description: API key not configured }
  /chat:
    post:
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "200":
          description: Toji reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReply" }
        "502": { description: Configured agent unavailable }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /events:
    get:
      operationId: getEvents
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: free_food, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CampusEvent" } }
  /clubs:
    get:
      operationId: getClubs
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Clubs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Club" } }
  /opportunities:
    get:
      operationId: getOpportunities
      responses:
        "200":
          description: Fictional opportunities
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Opportunity" } }
  /onboarding:
    post:
      operationId: saveOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
  /session/reset:
    post:
      operationId: resetPersonalization
      summary: Clear this browser's session without deleting student profiles
      responses:
        "200":
          description: Session cleared and anonymous profile returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "403":
          description: Cross-site reset request rejected
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Current browser profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
  /recommendations:
    get:
      operationId: getRecommendations
      parameters:
        - { name: user, in: query, schema: { type: string } }
      responses:
        "200":
          description: Nonconflicting matches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CampusEvent" } }
  /refresh:
    post:
      operationId: refreshEvents
      responses:
        "200":
          description: Crawl status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshStatus" }
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Campus discovery summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampusSummary" }
components:
  securitySchemes:
    SignupKey: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    SignupInput:
      type: object
      required: [first_name, phone, consent]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, maxLength: 30 }
        interests: { type: array, maxItems: 30, items: { type: string, maxLength: 100 } }
        classes: { type: string, maxLength: 2000 }
        consent: { type: boolean }
    SignupReceipt:
      type: object
      required: [message]
      properties:
        message: { type: string }
    SignupRecord:
      type: object
      required: [id, profile_id, first_name, phone, interests, classes, consent, consent_text, consent_version, created_at]
      properties:
        id: { type: integer }
        profile_id: { type: string }
        first_name: { type: string }
        phone: { type: string }
        interests: { type: array, items: { type: string } }
        classes: { type: string }
        consent: { type: boolean }
        consent_text: { type: string }
        consent_version: { type: string }
        created_at: { type: string }
    SignupFeed:
      type: object
      required: [signups, next_after_id]
      properties:
        signups: { type: array, items: { $ref: "#/components/schemas/SignupRecord" } }
        next_after_id: { type: integer }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        session_id: { type: string, maxLength: 128 }
        phone: { type: string, maxLength: 30, description: Must match this browser's signup; never used as authentication }
    ChatReply:
      type: object
      required: [reply, session_id, placeholder]
      properties:
        reply: { type: string }
        session_id: { type: string }
        placeholder: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    CampusEvent:
      type: object
      required: [id, title, host, date_str, location, description, tags, free_food, source, source_url, updated_at, sample_data, category, start, end, lat, lng]
      properties:
        id: { type: integer }
        title: { type: string }
        host: { type: string }
        date_str: { type: string }
        location: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        free_food: { type: boolean }
        source: { type: string }
        source_url: { type: string }
        updated_at: { type: ["string", "null"] }
        sample_data: { type: boolean }
        category: { type: string }
        start: { type: ["string", "null"] }
        end: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        conflict: { type: boolean }
        match_score: { type: number }
        matched_reasons: { type: array, items: { type: string } }
    Club:
      type: object
      required: [id, name, category, description, meeting_times, source_url, sample_data]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        meeting_times: { type: string }
        source_url: { type: string }
        sample_data: { type: boolean }
    Opportunity:
      type: object
      required: [id, title, organization, type, description, deadline, location, url, sample_data]
      properties:
        id: { type: integer }
        title: { type: string }
        organization: { type: string }
        type: { type: string }
        description: { type: string }
        deadline: { type: ["string", "null"] }
        location: { type: string }
        url: { type: string }
        sample_data: { type: boolean }
    ClassBlock:
      type: object
      required: [day, start, end, title]
      properties:
        day: { type: integer, minimum: 0, maximum: 6, description: "0=Monday, 6=Sunday" }
        start: { type: string }
        end: { type: string }
        title: { type: string }
    StudentInput:
      type: object
      required: [phone, interests, availability, frequency]
      properties:
        phone: { type: string }
        email: { type: string, maxLength: 254 }
        consent: { type: boolean, default: false }
        interests: { type: array, items: { type: string } }
        goals: { type: array, maxItems: 30, items: { type: string, maxLength: 100 } }
        notes: { type: string, maxLength: 1000 }
        gmail_consent: { type: boolean }
        availability: { type: array, items: { $ref: "#/components/schemas/ClassBlock" } }
        frequency: { type: string, enum: [daily, weekly, twice-weekly] }
        name: { type: string }
    StudentProfile:
      type: object
      required: [user, onboarded, consent, interests, availability, frequency, name, email, goals, notes, email_verified, phone_verified, gmail_consent]
      properties:
        user: { type: string }
        onboarded: { type: boolean }
        consent: { type: boolean }
        interests: { type: array, items: { type: string } }
        goals: { type: array, items: { type: string } }
        notes: { type: string }
        availability: { type: array, items: { $ref: "#/components/schemas/ClassBlock" } }
        frequency: { type: string }
        name: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        phone_verified: { type: boolean }
        gmail_consent: { type: boolean }
    RefreshStatus:
      type: object
      required: [status, count, message, sample_data]
      properties:
        status: { type: string }
        count: { type: integer }
        message: { type: string }
        sample_data: { type: boolean }
    CampusSummary:
      type: object
      required: [events, clubs, opportunities, free_food, tags, categories, last_updated, sample_data]
      properties:
        events: { type: integer }
        clubs: { type: integer }
        opportunities: { type: integer }
        free_food: { type: integer }
        tags: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        last_updated: { type: ["string", "null"] }
        sample_data: { type: boolean }
